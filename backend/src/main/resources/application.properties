spring.application.name=eZapytanie

# MongoDB
spring.mongodb.uri=mongodb://${MONGO_ROOT_USER:admin}:${MONGO_ROOT_PASSWORD:secretpassword123}@localhost:27017/ezapytanie?authSource=admin
spring.data.mongodb.auto-index-creation=true

# JWT
jwt.secret=${JWT_SECRET:dev-secret-key-for-local-only-do-not-use-in-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiry-days=${REFRESH_TOKEN_EXPIRY_DAYS:7}

spring.mvc.format.date-time=iso