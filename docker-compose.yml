version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: ezapytanie-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ezapytanie
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - ezapytanie-net

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ezapytanie-mongo-express
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"
    networks:
      - ezapytanie-net

volumes:
  mongo_data:

networks:
  ezapytanie-net:
    driver: bridge
